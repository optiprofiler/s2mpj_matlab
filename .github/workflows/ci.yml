name: CI

on:
  push:
  pull_request:
  schedule:
    # 07:00 Beijing time.
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout OptiProfiler
        uses: actions/checkout@v4
        with:
          repository: optiprofiler/optiprofiler
          path: optiprofiler
          ref: main

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024a

      - name: Check source redistribution notices
        run: |
          git archive --format=zip --output="$RUNNER_TEMP/s2mpj-matlab.zip" HEAD
          python3 tests/check_distribution.py "$RUNNER_TEMP/s2mpj-matlab.zip"

      - name: Run adapter smoke and random tests
        uses: matlab-actions/run-command@v2
        with:
          command: "run('tests/smoke_s2mpj_matlab.m'); addpath('tests'); test_constraint_hessians"
